name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check HTML validity
        run: npx html-validate --no-config --rule 'void:off' pages/*.html index.html 2>/dev/null || echo "html-validate not available, skipping"

      - name: Check styles.css syntax
        run: npx stylelint styles.css 2>/dev/null || echo "stylelint not available, skipping"

      - name: Check JS syntax
        run: node --check scripts/rs-chat-widget.js && node --check api/chat.js && echo "JS syntax OK"

      - name: Validate knowledge base integrity
        run: npm run validate:kb

      - name: Run test suite
        run: npm test

      - name: Build check
        run: npx vercel build --prod 2>/dev/null || echo "Vercel build skipped (not authenticated in CI)"
