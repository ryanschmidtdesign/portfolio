<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <filter id="pulp">
    <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="grain" />
    <feDiffuseLighting in="grain" lighting-color="#ffffff" surfaceScale="1.4" result="light">
      <feDistantLight azimuth="45" elevation="60" />
    </feDiffuseLighting>
    <feComponentTransfer in="light" result="paper">
      <feFuncR type="linear" slope="0.95" intercept="0.05" />
      <feFuncG type="linear" slope="0.95" intercept="0.05" />
      <feFuncB type="linear" slope="0.95" intercept="0.05" />
    </feComponentTransfer>
    <feBlend mode="multiply" in="SourceGraphic" in2="paper" />
  </filter>
  <rect width="240" height="240" fill="#f8f5eb" filter="url(#pulp)" opacity="0.9" />
</svg>
