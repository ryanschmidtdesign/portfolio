<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <g id="crayon-art" stroke-linecap="round" stroke-linejoin="round">
    <!-- Smiling Yellow Sun with Waxy Rays (Top Right) -->
    <g id="sun" transform="translate(515, 80)">
      <!-- Sun Rays -->
      <path d="M 0,-44 L 0,-62 M 30,-30 L 44,-44 M 44,0 L 62,0 M 30,30 L 44,44 M 0,44 L 0,62 M -30,30 L -44,44 M -44,0 L -62,0 M -30,-30 L -44,-44"
            stroke="#F59E0B" stroke-width="6.5" fill="none" opacity="0.9" />
      <!-- Sun Body -->
      <circle cx="0" cy="0" r="30" fill="#FDE047" stroke="#EAB308" stroke-width="5.5" />
      <!-- Sun Smiling Face -->
      <circle cx="-9" cy="-5" r="2.8" fill="#B45309" />
      <circle cx="9" cy="-5" r="2.8" fill="#B45309" />
      <path d="M -11,6 Q 0,17 11,6" stroke="#B45309" stroke-width="3.5" fill="none" />
      <circle cx="-15" cy="4" r="4" fill="#FCA5A5" opacity="0.6" />
      <circle cx="15" cy="4" r="4" fill="#FCA5A5" opacity="0.6" />
    </g>

    <!-- Fluffy Crayon Cloud (Top Left) -->
    <g id="cloud" stroke="#93C5FD" stroke-width="5" fill="rgba(219, 234, 254, 0.55)">
      <path d="M 75,85 Q 90,65 113,72 Q 133,58 153,74 Q 170,68 180,84 Q 190,100 175,114 Q 157,124 135,120 Q 113,126 93,116 Q 73,120 65,102 Q 60,88 75,85 Z" />
    </g>

    <!-- Flying Crayon Birds (V's) -->
    <g id="birds" stroke="#3B82F6" stroke-width="3.5" fill="none">
      <path d="M 195,65 Q 203,55 211,65 Q 219,55 227,65" />
      <path d="M 370,55 Q 377,47 384,55 Q 391,47 398,55" />
    </g>

    <!-- Floating Pink Crayon Heart -->
    <g id="heart" transform="translate(295, 125) rotate(-6)">
      <path d="M 0,-12 C 0,-24 -18,-24 -18,-10 C -18,4 0,16 0,16 C 0,16 18,4 18,-10 C 18,-24 0,-24 0,-12 Z"
            fill="#F472B6" stroke="#DB2777" stroke-width="3.5" />
    </g>

    <!-- Ground / Grass Line -->
    <g id="ground">
      <!-- Wavy Green Grass Baseline -->
      <path d="M 20,412 Q 160,404 300,410 Q 440,414 580,408" stroke="#65A30D" stroke-width="7" fill="none" />
      
      <!-- Grass Tufts -->
      <path d="M 70,410 L 74,392 M 78,411 L 86,390 M 87,411 L 95,394" stroke="#4D7C0F" stroke-width="4" />
      <path d="M 160,408 L 163,390 M 168,410 L 175,388 M 177,409 L 184,392" stroke="#4D7C0F" stroke-width="4" />
      <path d="M 245,411 L 248,393 M 253,412 L 260,390 M 262,411 L 269,394" stroke="#4D7C0F" stroke-width="4" />
      <path d="M 345,412 L 348,393 M 353,413 L 360,390 M 362,412 L 369,394" stroke="#4D7C0F" stroke-width="4" />
      <path d="M 435,410 L 438,391 M 443,411 L 450,388 M 452,410 L 459,393" stroke="#4D7C0F" stroke-width="4" />
      <path d="M 530,408 L 533,390 M 538,410 L 545,387 M 547,409 L 554,392" stroke="#4D7C0F" stroke-width="4" />

      <!-- Little Wildflowers in Grass -->
      <circle cx="140" cy="404" r="5" fill="#EC4899" stroke="#BE185D" stroke-width="2.5" />
      <circle cx="140" cy="404" r="1.8" fill="#FDE047" />
      <circle cx="418" cy="406" r="5" fill="#F59E0B" stroke="#D97706" stroke-width="2.5" />
      <circle cx="418" cy="406" r="1.8" fill="#DC2626" />
      <circle cx="560" cy="404" r="5" fill="#8B5CF6" stroke="#6D28D9" stroke-width="2.5" />
      <circle cx="560" cy="404" r="1.8" fill="#FDE047" />
    </g>

    <!-- ================================================================= -->
    <!-- STICK FIGURE FAMILY: Mom, Toddler Son, Dad, and 2 Cats             -->
    <!-- Appearances accurately matched to family-pic.jpg and polaroids    -->
    <!-- ================================================================= -->

    <!-- 1. MOM (Left of Son) -->
    <!-- Asian woman with dark hair in a low bun, dusty plum t-shirt, dark jogger pants -->
    <g id="mom" transform="translate(195, 0)">
      <!-- Head -->
      <circle cx="0" cy="190" r="22" fill="#FFE2D1" stroke="#37271F" stroke-width="4.5" />
      
      <!-- Dark hair in a low neat bun -->
      <!-- Hair bun behind head -->
      <circle cx="-22" cy="195" r="10" fill="#1C1917" stroke="#0C0A09" stroke-width="3.5" />
      <!-- Hair on head -->
      <path d="M -16,182 Q 0,165 17,178 Q 20,188 18,198 Q 12,176 -4,178 Q -14,179 -16,182 Z" fill="#1C1917" />
      
      <!-- Face: Simple dots and curved smile -->
      <circle cx="-6" cy="188" r="2.6" fill="#1C1917" />
      <circle cx="6" cy="188" r="2.6" fill="#1C1917" />
      <path d="M -7,198 Q 0,207 7,198" stroke="#BE185D" stroke-width="3" fill="none" />
      <circle cx="-12" cy="196" r="3.5" fill="#FDA4AF" opacity="0.6" />
      <circle cx="12" cy="196" r="3.5" fill="#FDA4AF" opacity="0.6" />

      <!-- Neck -->
      <line x1="0" y1="212" x2="0" y2="222" stroke="#FFE2D1" stroke-width="7" />

      <!-- Dusty Plum / Mauve T-Shirt (Trapezoid stick body) -->
      <path d="M -14,222 L 14,222 L 18,290 L -18,290 Z" fill="#9C526B" stroke="#7A3950" stroke-width="4.5" />
      <!-- Crayon scribble fill inside shirt -->
      <path d="M -10,238 L 10,242 M -12,256 L 12,260 M -13,274 L 13,278" stroke="#833852" stroke-width="3.5" />

      <!-- Left Arm (resting gently down at side) -->
      <path d="M -14,228 L -36,275" stroke="#FFE2D1" stroke-width="6.5" />
      <circle cx="-36" cy="275" r="4" fill="#FFE2D1" />

      <!-- Right Arm (reaching to hold toddler son's hand!) -->
      <path d="M 14,232 L 65,285" stroke="#FFE2D1" stroke-width="6.5" />

      <!-- Dark Charcoal Pants / Legs -->
      <line x1="-8" y1="290" x2="-9" y2="406" stroke="#334155" stroke-width="8.5" />
      <line x1="8" y1="290" x2="9" y2="406" stroke="#334155" stroke-width="8.5" />

      <!-- Dark Shoes -->
      <ellipse cx="-11" cy="408" rx="8" ry="4.5" fill="#1E293B" stroke="#0F172A" stroke-width="2.5" />
      <ellipse cx="11" cy="408" rx="8" ry="4.5" fill="#1E293B" stroke="#0F172A" stroke-width="2.5" />
    </g>

    <!-- 2. TODDLER SON (Center, holding Mom & Dad's hands) -->
    <!-- Dark hair with bangs, joyful laughing face, terracotta t-shirt, navy sweatpants, yellow sneakers! -->
    <g id="son" transform="translate(295, 0)">
      <!-- Head -->
      <circle cx="0" cy="255" r="18" fill="#FFE2D1" stroke="#37271F" stroke-width="4" />
      
      <!-- Dark hair with toddler bangs -->
      <path d="M -14,248 Q -6,236 6,240 Q 15,244 14,252 Q 8,242 -2,243 Q -10,243 -14,248 Z" fill="#1C1917" />
      <path d="M -8,247 L -5,253 M 0,246 L 2,253 M 6,247 L 7,252" stroke="#1C1917" stroke-width="2" />

      <!-- Big Happy Laughing Eyes & Open Smile -->
      <circle cx="-5" cy="254" r="2.3" fill="#1C1917" />
      <circle cx="5" cy="254" r="2.3" fill="#1C1917" />
      <!-- Open grinning mouth -->
      <path d="M -7,262 Q 0,273 7,262 Z" fill="#E11D48" stroke="#9F1239" stroke-width="2" />
      <!-- Rosy cheeks -->
      <circle cx="-10" cy="260" r="3" fill="#FB7185" opacity="0.7" />
      <circle cx="10" cy="260" r="3" fill="#FB7185" opacity="0.7" />

      <!-- Neck -->
      <line x1="0" y1="273" x2="0" y2="280" stroke="#FFE2D1" stroke-width="6" />

      <!-- Terracotta / Burnt-Orange T-Shirt -->
      <path d="M -11,280 L 11,280 L 13,332 L -13,332 Z" fill="#C86446" stroke="#9A3B22" stroke-width="4" />
      <path d="M -8,295 L 8,298 M -9,312 L 9,315" stroke="#B24F33" stroke-width="3" />

      <!-- Left Arm UP holding Mom's hand! -->
      <path d="M -11,286 L -35,285" stroke="#FFE2D1" stroke-width="5.5" />
      <!-- Little hand clasping Mom's hand -->
      <circle cx="-35" cy="285" r="4" fill="#FFE2D1" />

      <!-- Right Arm UP holding Dad's hand! -->
      <path d="M 11,286 L 35,285" stroke="#FFE2D1" stroke-width="5.5" />
      <!-- Little hand clasping Dad's hand -->
      <circle cx="35" cy="285" r="4" fill="#FFE2D1" />

      <!-- Navy Blue Sweatpants -->
      <line x1="-6" y1="332" x2="-7" y2="398" stroke="#1E3A8A" stroke-width="7" />
      <line x1="6" y1="332" x2="7" y2="398" stroke="#1E3A8A" stroke-width="7" />

      <!-- Bright Yellow Sneakers (from family-pic.jpg) -->
      <ellipse cx="-8" cy="402" rx="7" ry="4" fill="#FBBF24" stroke="#D97706" stroke-width="2.5" />
      <ellipse cx="8" cy="402" rx="7" ry="4" fill="#FBBF24" stroke="#D97706" stroke-width="2.5" />
    </g>

    <!-- 3. DAD (Ryan, Right of Son) -->
    <!-- Taller, short light brown hair, olive green t-shirt, khaki/brown hiking pants -->
    <g id="dad" transform="translate(390, 0)">
      <!-- Head -->
      <circle cx="0" cy="172" r="24" fill="#FFE2D1" stroke="#37271F" stroke-width="4.5" />
      
      <!-- Short light brown hair (crew cut) -->
      <path d="M -18,162 Q 0,146 18,158 Q 20,166 16,174 Q 10,158 -2,160 Q -14,161 -18,162 Z" fill="#6B4F3B" stroke="#4A3525" stroke-width="2.5" />

      <!-- Face: Simple dots and friendly smile -->
      <circle cx="-7" cy="170" r="2.8" fill="#1C1917" />
      <circle cx="7" cy="170" r="2.8" fill="#1C1917" />
      <path d="M -8,180 Q 0,190 8,180" stroke="#BE185D" stroke-width="3" fill="none" />
      <circle cx="-13" cy="178" r="4" fill="#FDA4AF" opacity="0.55" />
      <circle cx="13" cy="178" r="4" fill="#FDA4AF" opacity="0.55" />

      <!-- Neck -->
      <line x1="0" y1="196" x2="0" y2="208" stroke="#FFE2D1" stroke-width="8" />

      <!-- Olive Green Crewneck T-Shirt -->
      <path d="M -17,208 L 17,208 L 19,285 L -19,285 Z" fill="#5F7444" stroke="#43532F" stroke-width="4.5" />
      <!-- Crayon scribble texture -->
      <path d="M -12,226 L 12,230 M -14,246 L 14,250 M -13,266 L 13,270" stroke="#4C5E37" stroke-width="3.5" />

      <!-- Left Arm (reaching to hold toddler son's hand!) -->
      <path d="M -17,215 L -60,285" stroke="#FFE2D1" stroke-width="7" />

      <!-- Right Arm (waving high!) -->
      <path d="M 17,215 L 48,175" stroke="#FFE2D1" stroke-width="7" />
      <!-- Waving hand & stick fingers -->
      <circle cx="48" cy="175" r="4.5" fill="#FFE2D1" />
      <path d="M 46,168 L 47,161 M 51,170 L 55,164 M 53,176 L 60,172" stroke="#37271F" stroke-width="2.2" />

      <!-- Khaki / Brown Hiking Pants -->
      <line x1="-9" y1="285" x2="-10" y2="405" stroke="#785E4F" stroke-width="9" />
      <line x1="9" y1="285" x2="10" y2="405" stroke="#785E4F" stroke-width="9" />

      <!-- Trail Shoes -->
      <ellipse cx="-13" cy="408" rx="9" ry="5" fill="#C26A3B" stroke="#873E16" stroke-width="2.5" />
      <ellipse cx="13" cy="408" rx="9" ry="5" fill="#C26A3B" stroke="#873E16" stroke-width="2.5" />
    </g>

    <!-- 4. TUXEDO CAT (Pickles - Left, sitting near Mom) -->
    <!-- Black and white tuxedo cat with white blaze, green eyes, white paws -->
    <g id="tuxedo-cat" transform="translate(110, 360)">
      <!-- Sitting Body (Black oval with white chest) -->
      <ellipse cx="0" cy="22" rx="18" ry="24" fill="#1C1917" stroke="#0C0A09" stroke-width="3.5" />
      <!-- White Chest/Bib -->
      <path d="M 0,6 L -7,24 L 0,38 L 7,24 Z" fill="#FFFFFF" />

      <!-- Head (Black circle with white blaze down nose) -->
      <circle cx="0" cy="-4" r="15" fill="#1C1917" stroke="#0C0A09" stroke-width="3.5" />
      <!-- White blaze down nose -->
      <polygon points="0,-10 -4,4 0,7 4,4" fill="#FFFFFF" />

      <!-- Pointy Ears (Triangles) -->
      <polygon points="-12,-12 -16,-28 -2,-17" fill="#1C1917" stroke="#0C0A09" stroke-width="2.5" />
      <polygon points="-10,-13 -14,-24 -4,-17" fill="#FDA4AF" />
      <polygon points="12,-12 16,-28 2,-17" fill="#1C1917" stroke="#0C0A09" stroke-width="2.5" />
      <polygon points="10,-13 14,-24 4,-17" fill="#FDA4AF" />

      <!-- Green Cat Eyes -->
      <circle cx="-5" cy="-5" r="2.5" fill="#22C55E" />
      <circle cx="-5" cy="-5" r="1.2" fill="#052E16" />
      <circle cx="5" cy="-5" r="2.5" fill="#22C55E" />
      <circle cx="5" cy="-5" r="1.2" fill="#052E16" />

      <!-- Pink Nose -->
      <polygon points="0,-1 -2,-3 2,-3" fill="#FB7185" />

      <!-- White Whiskers -->
      <line x1="-6" y1="-2" x2="-20" y2="-5" stroke="#FFFFFF" stroke-width="1.8" />
      <line x1="-6" y1="1" x2="-21" y2="2" stroke="#FFFFFF" stroke-width="1.8" />
      <line x1="6" y1="-2" x2="20" y2="-5" stroke="#FFFFFF" stroke-width="1.8" />
      <line x1="6" y1="1" x2="21" y2="2" stroke="#FFFFFF" stroke-width="1.8" />

      <!-- White Paws -->
      <ellipse cx="-8" cy="44" rx="5" ry="3.5" fill="#FFFFFF" stroke="#0C0A09" stroke-width="2" />
      <ellipse cx="8" cy="44" rx="5" ry="3.5" fill="#FFFFFF" stroke="#0C0A09" stroke-width="2" />

      <!-- Curled Black Tail -->
      <path d="M -16,30 Q -32,22 -30,8 Q -28,-2 -18,4" stroke="#1C1917" stroke-width="5.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- 5. TABBY CAT (Pesto - Right, sitting near Dad) -->
    <!-- Brown/tan tabby cat with white muzzle/chest, striped ears, amber eyes -->
    <g id="tabby-cat" transform="translate(480, 360)">
      <!-- Sitting Body (Tan/brown with tabby stripes) -->
      <ellipse cx="0" cy="22" rx="18" ry="24" fill="#D4A373" stroke="#8A5A36" stroke-width="3.5" />
      <!-- Tabby stripes on body -->
      <path d="M -11,14 L 0,18 L 11,14 M -13,26 L 0,30 L 13,26 M -10,38 L 0,41 L 10,38" stroke="#6F4525" stroke-width="2.5" fill="none" />
      <!-- White Chest/Bib -->
      <ellipse cx="0" cy="24" rx="9" ry="14" fill="#FFFDF8" opacity="0.9" />

      <!-- Head (Tan/brown with white muzzle) -->
      <circle cx="0" cy="-4" r="15" fill="#D4A373" stroke="#8A5A36" stroke-width="3.5" />
      <ellipse cx="0" cy="2" rx="7" ry="5.5" fill="#FFFDF8" />
      <!-- Forehead tabby 'M' -->
      <path d="M -4,-14 L 0,-9 L 4,-14 M 0,-14 L 0,-8" stroke="#6F4525" stroke-width="2" fill="none" />

      <!-- Pointy Ears (Triangles with big pink interior like photo!) -->
      <polygon points="-12,-12 -16,-28 -2,-17" fill="#D4A373" stroke="#8A5A36" stroke-width="2.5" />
      <polygon points="-10,-13 -14,-25 -4,-17" fill="#FDA4AF" />
      <polygon points="12,-12 16,-28 2,-17" fill="#D4A373" stroke="#8A5A36" stroke-width="2.5" />
      <polygon points="10,-13 14,-25 4,-17" fill="#FDA4AF" />

      <!-- Amber Cat Eyes -->
      <circle cx="-5" cy="-5" r="2.5" fill="#EAB308" />
      <circle cx="-5" cy="-5" r="1.2" fill="#451A03" />
      <circle cx="5" cy="-5" r="2.5" fill="#EAB308" />
      <circle cx="5" cy="-5" r="1.2" fill="#451A03" />

      <!-- Pink Nose -->
      <polygon points="0,-1 -2,-3 2,-3" fill="#FB7185" />

      <!-- Whiskers -->
      <line x1="-6" y1="-1" x2="-20" y2="-4" stroke="#451A03" stroke-width="1.5" />
      <line x1="-6" y1="2" x2="-21" y2="3" stroke="#451A03" stroke-width="1.5" />
      <line x1="6" y1="-1" x2="20" y2="-4" stroke="#451A03" stroke-width="1.5" />
      <line x1="6" y1="2" x2="21" y2="3" stroke="#451A03" stroke-width="1.5" />

      <!-- White Paws -->
      <ellipse cx="-8" cy="44" rx="5" ry="3.5" fill="#FFFDF8" stroke="#8A5A36" stroke-width="2" />
      <ellipse cx="8" cy="44" rx="5" ry="3.5" fill="#FFFDF8" stroke="#8A5A36" stroke-width="2" />

      <!-- Curled Striped Tail -->
      <path d="M 16,30 Q 32,22 30,8 Q 28,-2 18,4" stroke="#D4A373" stroke-width="5.5" fill="none" stroke-linecap="round" />
      <path d="M 22,25 L 26,22 M 28,17 L 31,14 M 26,6 L 24,3" stroke="#6F4525" stroke-width="2.5" />
    </g>
  </g>
</svg>
